<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>두뇌 게임방 · 퍼즐 & 미니게임 모음</title>
<style>
:root{--gold:#d9b45a;--bg:#0b0d10;--card:#14171c;--line:#262b33;--tx:#e8e6df;--mut:#8a8f98}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#home{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 28px}
h1{font-size:22px;margin:6px 0 4px;letter-spacing:-.3px}
h1 b{color:var(--gold)}
.lead{font-size:13px;color:var(--mut);margin:0 0 18px;line-height:1.55}
.grid{display:grid;gap:10px}
.g{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:inherit;font:inherit;width:100%;cursor:pointer}
.g:active{border-color:var(--gold)}
.g .ic{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:#1d2128}
.g h2{font-size:16px;margin:0 0 3px}
.g p{font-size:12.5px;color:var(--mut);margin:0;line-height:1.45}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:2px;background:var(--gold);color:#1a1405}
.g.soon{opacity:.55;cursor:default}
.g.soon .tag{background:#2a2f38;color:var(--mut)}
.sec{font-size:12px;color:var(--mut);margin:20px 2px 8px;letter-spacing:.5px}
.disc{font-size:11px;color:#6d727b;line-height:1.5;margin-top:22px;text-align:center}
#play{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
#play.on{display:flex}
#bar{flex:none;display:flex;align-items:center;gap:10px;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;border-bottom:1px solid var(--line);background:#0e1115}
#back{background:none;border:0;color:var(--gold);font:inherit;font-size:14px;font-weight:700;padding:8px 6px;cursor:pointer}
#ttl{font-size:14px;color:var(--tx)}
#frame{flex:1;width:100%;border:0;background:#fff}
</style></head><body>
<div id="home">
  <h1>두뇌 <b>게임방</b></h1>
  <p class="lead">TV 두뇌 서바이벌에서 영감을 받은 퍼즐과 미니게임을 한곳에 모았어요. 눌러서 바로 플레이하세요.</p>
  <div class="sec">지금 할 수 있는 게임</div>
  <div class="grid" id="list"></div>
  <div class="sec">준비 중</div>
  <div class="grid" id="soon"></div>
  <p class="disc">이 사이트는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.<br>방송사·제작사와 관련 없는 팬이 만든 비공식 게임입니다.</p>
</div>
<div id="play"><div id="bar"><button id="back">← 목록</button><span id="ttl"></span></div><iframe id="frame" title="game" allow="fullscreen"></iframe></div>
<script>
var GAMES=[
 {id:'key',ic:'🗝️',name:'황금 열쇠 퍼즐',tag:'3D',desc:'금빛 열쇠를 직접 돌려 끼워 맞춰 격자를 완성해요. 1탄 12개, 2탄 8개.',src:'games/key/index.html'},
 {id:'fence',ic:'🔲',name:'울타리 퍼즐 10×10',tag:'',desc:'숫자 주변에 그 숫자만큼 선을 그어 끊김 없는 하나의 울타리를 만들어요.',src:'games/fence/index.html'}
];
var SOON=[
 {ic:'🐷',name:'저금통 의심 게임',desc:'동전 개수를 속이고 의심하는 심리전 (컴퓨터 상대).'},
 {ic:'🧩',name:'조각 대칭 찾기',desc:'조각을 보고 대칭인 짝을 찾는 퍼즐.'}
];
function $(i){return document.getElementById(i)}
function card(g,soon){
  var b=document.createElement(soon?'div':'button');b.className='g'+(soon?' soon':'');
  b.innerHTML='<div class="ic">'+g.ic+'</div><div><h2>'+g.name+'<span class="tag">'+(soon?'준비 중':(g.tag||'NEW'))+'</span></h2><p>'+g.desc+'</p></div>';
  if(!soon)b.onclick=function(){location.hash=g.id};
  return b;
}
GAMES.forEach(function(g){$('list').appendChild(card(g,false))});
SOON.forEach(function(g){$('soon').appendChild(card(g,true))});
function route(){
  var id=location.hash.slice(1),g=GAMES.filter(function(x){return x.id===id})[0];
  if(g){$('ttl').textContent=g.name;$('frame').contentWindow.location.replace(g.src);$('play').classList.add('on');document.title=g.name+' · 두뇌 게임방'}
  else{$('play').classList.remove('on');$('frame').contentWindow.location.replace('about:blank');document.title='두뇌 게임방 · 퍼즐 & 미니게임 모음'}
}
$('back').onclick=function(){location.hash=''};
window.addEventListener('hashchange',route);route();
</script></body></html>
